<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Boarding House Admin Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>

}

#viewToast {

  padding: 8px 16px;
  font-size: 13px;
  font-weight: 600;
  color: #0f172a;
  background: rgba(255, 255, 255, 0.92);

  border-radius: 999px;
  box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15);
  pointer-events: none;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s;
  z-index: 10;
}
#viewToast.show {
  opacity: 1;
  visibility: visible;
  transform: translateX(-50%) translateY(0);
}
</style></head><body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

}

  const color = getRoomStatusColor(R);
  const c = document.createElement('canvas'); c.width = 160; c.height = 200; const g = c.getContext('2d');
  
  const pad = 16;
  g.beginPath();
  g.moveTo(80, 185);

  g.arc(80, 68, 64, Math.PI, 0, false);
  g.bezierCurveTo(160 - pad, 95, 160 - pad - 10, 125, 80, 185);

  g.fillStyle = darkMap ? '#0f1830' : '#ffffff'; g.fill();

  const numStr = String(dn(R.n));
  g.fillStyle = darkMap ? '#ffffff' : '#1c1f24'; 
  g.font = `bold ${numStr.length > 1 ? '50px' : '56px'} system-ui,sans-serif`; 
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(numStr, 80, 68);
  
  const tex = new THREE.CanvasTexture(c); tex.needsUpdate = true;
  if(R.sp) { R.sp.material.map.dispose(); R.sp.material.map = tex; }
  else {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({map: tex, sizeAttenuation: false, depthTest: false, transparent: true}));
    s.center.set(0.5, 0.05);

function updateRoomLabels(){ Object.values(rooms).forEach(R => { if(R.sp) mkLabel(R); }); }
function scaleLabels(){const e=cam.projectionMatrix.elements;Object.values(rooms).forEach(R=>R.sp&&R.sp.scale.set(2*LBL/innerWidth/e[0],(2*LBL/innerHeight/e[5])*(200/160),1))}

  let m=n.match(/^R(\d+)_Bed(\d+)_(A|B|post)/);if(!m)return;
  const r=+m[1],b=+m[2],R=rooms[r]=rooms[r]||{n:r,beds:{},box:new THREE.Box3()};
  const bed=R.beds[b]=R.beds[b]||{n:b,r,box:new THREE.Box3(),meshes:[]};
  o.userData={r,b,key:n.slice(0,-0)||n};bed.meshes.push(o);pick.push(o);bed.box.expandByObject(o);R.box.expandByObject(o);

  const gridCenter=box.getCenter(new THREE.Vector3());

  const grid=new THREE.GridHelper(320,160,darkMap?0x22314f:0x54745b,darkMap?0x14203a:0x293f30);grid.position.set(gridCenter.x,box.min.y-.02,gridCenter.z);grid.material.transparent=true;grid.material.opacity=.9;grid.material.depthWrite=false;scene.add(grid);

 Object.values(rooms).forEach(R=>{R.c=R.box.getCenter(new THREE.Vector3());R.s=R.box.getSize(new THREE.Vector3());
  R.sp=mkLabel(R);R.sp.position.set(R.c.x,R.box.max.y+1.2,R.c.z);scene.add(R.sp)});scaleLabels();
 const s=B.getSize(new THREE.Vector3()),c=B.getCenter(new THREE.Vector3());G.x=c.x;G.z=c.z;panAnchor={x:G.x,z:G.z};panLimit={x:Math.min(s.x*.08,3.5),z:Math.min(s.z*.08,3.5)};G.d=Math.max(s.x/(2*Math.tan(.39)*Math.min(1,innerWidth/innerHeight)),s.z/(2*Math.tan(.39)))*1.05;C.x=G.x;C.z=G.z;MAXD=G.d*1.15;DEF=G.d;G.d=DEF;C.d=DEF*1.3;

}
let MAXD=90,DEF=60;const MIND=()=>view.t==='map'?12:3;
let lgOpen=innerWidth>600;

function legend(){
  if(tenantMode){$('legendContainer').style.display='none';return}
  
  const bedCounts={};
  Object.values(rooms).forEach(R=>Object.values(R.beds).forEach(b=>['A','B'].forEach(k=>{
    const s=stat(`R${R.n}_Bed${b.n}_${k}`);
    bedCounts[s]=(bedCounts[s]||0)+1;
  })));

  const container = $('legendContainer');

  if(!lgOpen) {
    container.innerHTML = `
      <div class="g legend-collapsed" onclick="lgOpen=true;legend()">
        ${Object.entries(ST).map(([k,v])=>`<span><i style="background:${v[1]}"></i>${bedCounts[k]||0}</span>`).join('')}

      </div>`;
    return;
  }

  container.innerHTML = `
    <div class="g legend-card" onclick="lgOpen=false;legend()">
      <div class="section-title">Bed Status</div>
      ${Object.entries(ST).map(([k,v])=>`<div><i style="background:${v[1]}"></i>${v[0]} <b>${bedCounts[k]||0}</b></div>`).join('')}
      <div style="color:var(--mut);margin-top:4px;font-size:10px;text-align:right">Tap to collapse ▴</div>
    </div>
  `;

function setStatus(key,s){status[key]=s;save();const o=pick.find(p=>p.userData.key===key);paint(o);updateRoomLabels();legend();sheet()}
function chip(k){const s=ST[stat(k)];return `<span class="chip" style="background:${s[1]}">${s[0]}</span>`}
function getOccupantLabel(key){
  const st = stat(key);
  if (st === 'available') return '';
  const name = occupants[key] || (st === 'reserved' ? 'Reserved Boarder' : 'Occupant');
  return `<div class="occupant-tag">👤 ${name}</div>`;
}
function sheet(){const e=$('sheet');$('full').classList.toggle('details-open',view.t!=='map');

 if(view.t==='room'){const R=rooms[view.r];
  if(tenantMode){e.innerHTML=`<h2>Room ${dn(R.n)}</h2><div class="sub">${Object.keys(R.beds).length} beds · select a bed for details</div>`+Object.values(R.beds).map(b=>`<div class="row" data-b="${b.n}" style="cursor:pointer"><b>Bed ${b.n}</b><span>A ↑ Top bunk</span><span>B ↓ Bottom bunk</span></div>`).join('')}

  e.querySelectorAll('[data-k]').forEach(x=>x.onclick=()=>setStatus(x.dataset.k,x.dataset.s))}}
const unwrap=y=>{C.yaw+=Math.round((y-C.yaw)/TAU)*TAU};
function roomYaw(R){const c=B.getCenter(new THREE.Vector3());return Math.round(Math.atan2(c.x-R.c.x,c.z-R.c.z)/(Math.PI/2))*Math.PI/2}
function go(v){if(tenantMode){view=v;hov=null;const R=rooms[v.r];
 if(v.t==='map'){const c=B.getCenter(new THREE.Vector3());Object.assign(G,{x:c.x,z:c.z,d:DEF,tilt:tilted?.55:.15,yaw:0});unwrap(0);const s=B.getSize(new THREE.Vector3());panLimit={x:Math.min(s.x*.08,3.5),z:Math.min(s.z*.08,3.5)}}

 else{const b=R.beds[v.b],c=b.box.getCenter(new THREE.Vector3());G.x=c.x;G.z=c.z-.3;G.d=Math.max(b.box.getSize(new THREE.Vector3()).length()*1.3,5);G.tilt=tilted?.55:.15;G.yaw=roomYaw(R);unwrap(G.yaw)}
 if(v.t==='map'){const s=B.getSize(new THREE.Vector3());panLimit={x:Math.min(s.x*.08,3.5),z:Math.min(s.z*.08,3.5)}}else panLimit={x:1.5,z:1.5};panAnchor={x:G.x,z:G.z};sheet()}
$('back').onclick=()=>go(view.t==='bed'?(tenantMode&&view.from==='map'?{t:'map'}:{t:'room',r:view.r}):{t:'map'});$('rot').onclick=()=>{G.yaw+=Math.PI/2};

$('home').onclick=()=>{
